<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tab Stasher – Showcase Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #171822 0%, #08090d 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      color: #f4f4f6;
      padding: 24px;
      overflow: hidden;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.14);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #818cf8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.25);
    }

    .showcase-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .showcase-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .showcase-subtitle {
      font-size: 13px;
      color: #71717a;
      max-width: 480px;
    }

    .device-frame {
      width: 400px;
      height: 560px;
      border-radius: 16px;
      background: #09090b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.05), 0 0 40px -10px rgba(79, 70, 229, 0.25);
      overflow: hidden;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="showcase-header">
    <div class="badge-pill">Manifest V3 • Chromium Extension</div>
    <h1 class="showcase-title">Live Tab Stasher v1.2.0</h1>
    <p class="showcase-subtitle">Zero RAM Waste. Date-Based Tab Organization & Instant Recovery.</p>
  </div>

  <div class="device-frame">
    <iframe id="extensionFrame" src="popup.html"></iframe>
  </div>
</body>
</html>
