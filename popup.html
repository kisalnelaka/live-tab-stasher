<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tab Stasher</title>
  <style>
    :root {
      /* Material 3 Light Color System */
      --md-sys-color-primary: #0b57d0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d3e3fd;
      --md-sys-color-on-primary-container: #041e49;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-dim: #f8f9fa;
      --md-sys-color-surface-container: #f0f4f9;
      --md-sys-color-surface-container-high: #e9eef6;
      --md-sys-color-on-surface: #1f1f1f;
      --md-sys-color-on-surface-variant: #444746;
      --md-sys-color-outline: #747775;
      --md-sys-color-outline-variant: #e0e2ec;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;
      --md-sys-color-inverse-surface: #303030;
      --md-sys-color-inverse-on-surface: #f1f1f1;
      --md-sys-color-inverse-primary: #a8c7fa;

      /* Material 3 Shape & Elevations */
      --md-shape-full: 9999px;
      --md-shape-large: 16px;
      --md-shape-medium: 12px;
      --md-shape-small: 8px;
      --md-elevation-1: 0 1px 3px 1px rgba(0, 0, 0, 0.12), 0 1px 2px 0 rgba(0, 0, 0, 0.24);
      --md-elevation-2: 0 2px 6px 2px rgba(0, 0, 0, 0.12), 0 1px 2px 0 rgba(0, 0, 0, 0.24);
      --md-elevation-3: 0 4px 8px 3px rgba(0, 0, 0, 0.12), 0 1px 3px 0 rgba(0, 0, 0, 0.24);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Material 3 Dark Color System */
        --md-sys-color-primary: #a8c7fa;
        --md-sys-color-on-primary: #042e6f;
        --md-sys-color-primary-container: #0842a0;
        --md-sys-color-on-primary-container: #d3e3fd;
        --md-sys-color-surface: #1a1c1e;
        --md-sys-color-surface-dim: #131416;
        --md-sys-color-surface-container: #212428;
        --md-sys-color-surface-container-high: #2c2f34;
        --md-sys-color-on-surface: #e2e2e6;
        --md-sys-color-on-surface-variant: #c4c7c5;
        --md-sys-color-outline: #8e918f;
        --md-sys-color-outline-variant: #444746;
        --md-sys-color-error: #ffb4ab;
        --md-sys-color-error-container: #93000a;
        --md-sys-color-on-error-container: #ffdad6;
        --md-sys-color-inverse-surface: #e2e2e6;
        --md-sys-color-inverse-on-surface: #2f3033;
        --md-sys-color-inverse-primary: #0b57d0;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      min-height: 240px;
      max-height: 560px;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
      position: relative;
    }

    /* App Header / Top Bar */
    .app-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .app-branding {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      object-fit: contain;
    }

    .app-title-group {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.1px;
      color: var(--md-sys-color-on-surface);
      line-height: 1.2;
    }

    .app-stats {
      font-size: 11px;
      font-weight: 400;
      color: var(--md-sys-color-on-surface-variant);
    }

    .header-chips {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-chip {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--md-shape-full);
      letter-spacing: 0.2px;
      display: inline-flex;
      align-items: center;
    }

    /* Actions Section */
    .action-panel {
      padding: 12px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: var(--md-sys-color-surface);
    }

    /* Material 3 Filled Primary Button */
    .btn-primary {
      width: 100%;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: var(--md-shape-full);
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1px;
      cursor: pointer;
      box-shadow: var(--md-elevation-1);
      transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1),
                  box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1),
                  transform 0.1s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary:hover {
      box-shadow: var(--md-elevation-2);
      filter: brightness(1.06);
    }

    .btn-primary:active {
      transform: scale(0.985);
    }

    .btn-primary svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Search & Filter Toolbar */
    .toolbar-container {
      display: none;
      padding: 0 16px 8px 16px;
      gap: 8px;
      align-items: center;
    }

    .toolbar-container.visible {
      display: flex;
    }

    .search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 32px;
      padding: 0 28px 0 30px;
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-full);
      font-family: inherit;
      font-size: 12px;
      color: var(--md-sys-color-on-surface);
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-surface);
    }

    .search-box svg.search-icon {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      fill: var(--md-sys-color-on-surface-variant);
      pointer-events: none;
    }

    .btn-clear-search {
      display: none;
      position: absolute;
      right: 8px;
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--md-sys-color-on-surface-variant);
      padding: 0;
      align-items: center;
      justify-content: center;
    }

    .btn-clear-search.visible {
      display: flex;
    }

    .btn-clear-search svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .batch-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-text-action {
      background: transparent;
      border: none;
      font-size: 11px;
      font-weight: 500;
      color: var(--md-sys-color-primary);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: var(--md-shape-small);
      transition: background-color 0.15s;
    }

    .btn-text-action:hover {
      background-color: var(--md-sys-color-surface-container-high);
    }

    /* Notification / Error Banner */
    .alert-banner {
      display: none;
      margin: 0 16px 8px 16px;
      padding: 8px 12px;
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      border-radius: var(--md-shape-small);
      font-size: 11.5px;
      line-height: 1.4;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.2s cubic-bezier(0, 0, 0.2, 1);
    }

    .alert-banner.visible {
      display: flex;
    }

    .alert-banner svg {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Stashed Tabs List Container */
    .list-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 12px 12px;
      max-height: 380px;
    }

    .list-wrapper::-webkit-scrollbar {
      width: 6px;
    }

    .list-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }

    .list-wrapper::-webkit-scrollbar-thumb {
      background-color: var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-full);
    }

    .stashed-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Material 3 Card Item */
    .stashed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: var(--md-shape-medium);
      background-color: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      cursor: pointer;
      position: relative;
    }

    .stashed-item:hover {
      background-color: var(--md-sys-color-surface-container);
      border-color: var(--md-sys-color-outline);
    }

    .item-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .favicon-wrap {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background-color: var(--md-sys-color-surface-container-high);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .item-favicon {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .item-favicon-fallback {
      width: 14px;
      height: 14px;
      fill: var(--md-sys-color-on-surface-variant);
    }

    .item-text-group {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .item-title {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta span.separator {
      opacity: 0.4;
    }

    /* Actions on item */
    .item-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 6px;
      flex-shrink: 0;
    }

    .btn-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--md-shape-full);
      border: none;
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .btn-icon:hover {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
    }

    .btn-icon.delete:hover {
      background-color: rgba(186, 26, 26, 0.12);
      color: var(--md-sys-color-error);
    }

    .btn-icon svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    /* Empty State */
    .empty-state {
      padding: 36px 16px 28px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--md-sys-color-on-surface-variant);
      animation: fadeIn 0.25s ease;
    }

    .empty-illustration {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--md-sys-color-surface-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .empty-illustration svg {
      width: 24px;
      height: 24px;
      fill: var(--md-sys-color-outline);
    }

    .empty-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }

    .empty-subtitle {
      font-size: 11.5px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.4;
      max-width: 220px;
    }

    /* Material Snackbar */
    .snackbar {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background-color: var(--md-sys-color-inverse-surface);
      color: var(--md-sys-color-inverse-on-surface);
      border-radius: var(--md-shape-small);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--md-elevation-3);
      font-size: 12px;
      z-index: 100;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0, 0, 0.2, 1),
                  transform 0.2s cubic-bezier(0, 0, 0.2, 1);
    }

    .snackbar.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .snackbar-btn {
      background: none;
      border: none;
      color: var(--md-sys-color-inverse-primary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .snackbar-btn:hover {
      text-decoration: underline;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Material Top App Bar -->
  <header class="app-header">
    <div class="app-branding">
      <img src="icons/icon32.png" alt="Live Tab Stasher" class="app-icon">
      <div class="app-title-group">
        <span class="app-title">Live Tab Stasher</span>
        <span id="ramSavedLabel" class="app-stats">0 MB RAM freed</span>
      </div>
    </div>
    <div class="header-chips">
      <span id="tabCount" class="badge-chip" aria-label="Total stashed tabs">0</span>
    </div>
  </header>

  <!-- Primary Action Area -->
  <section class="action-panel">
    <button id="stashBtn" class="btn-primary" type="button" title="Stash active tab and close to free memory">
      <svg viewBox="0 0 24 24">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
      <span>Stash Current Tab</span>
    </button>
  </section>

  <!-- Alert Banner for Restricted Pages -->
  <aside id="alertBanner" class="alert-banner" role="alert" aria-live="polite">
    <svg viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
    </svg>
    <span id="alertMessage">Restricted browser page cannot be stashed.</span>
  </aside>

  <!-- Search & Bulk Action Toolbar -->
  <div id="toolbarContainer" class="toolbar-container">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input id="searchInput" class="search-input" type="text" placeholder="Search stashed tabs..." autocomplete="off" spellcheck="false">
      <button id="clearSearchBtn" class="btn-clear-search" type="button" aria-label="Clear search">
        <svg viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
    <div class="batch-actions">
      <button id="restoreAllBtn" class="btn-text-action" type="button" title="Restore all stashed tabs">Restore All</button>
    </div>
  </div>

  <!-- Stashed Tabs List -->
  <main class="list-wrapper">
    <ul id="stashedList" class="stashed-list">
      <!-- Injected dynamically by popup.js -->
    </ul>
  </main>

  <!-- Material Feedback Snackbar with Undo -->
  <div id="snackbar" class="snackbar" role="status">
    <span id="snackbarText">Tab stashed</span>
    <button id="snackbarUndoBtn" class="snackbar-btn" type="button">Undo</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
