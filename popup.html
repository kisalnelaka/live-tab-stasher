<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tab Stasher</title>
  <style>
    :root {
      --md-sys-color-primary: #0b57d0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d3e3fd;
      --md-sys-color-on-primary-container: #041e49;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-container: #f0f4f9;
      --md-sys-color-on-surface: #1f1f1f;
      --md-sys-color-on-surface-variant: #444746;
      --md-sys-color-outline: #c4c7c5;
      --md-sys-color-outline-variant: #e1e3e1;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;
      --md-shape-corner-full: 9999px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-small: 8px;
      --md-elevation-1: 0 1px 3px 1px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --md-elevation-2: 0 2px 6px 2px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      min-height: 200px;
      max-height: 520px;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    /* Top App Bar */
    .app-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface);
    }

    .app-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--md-sys-color-on-surface);
    }

    .app-badge {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--md-shape-corner-full);
      min-width: 20px;
      text-align: center;
    }

    /* Action Container */
    .action-container {
      padding: 12px 16px;
      background-color: var(--md-sys-color-surface);
    }

    /* Material Filled Button */
    .btn-primary {
      width: 100%;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: var(--md-shape-corner-full);
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1px;
      cursor: pointer;
      box-shadow: var(--md-elevation-1);
      transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1),
                  box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1),
                  transform 0.1s ease;
    }

    .btn-primary:hover {
      background-color: #0842a0;
      box-shadow: var(--md-elevation-2);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* System Alert Notification */
    .alert-banner {
      display: none;
      margin: 0 16px 8px 16px;
      padding: 8px 12px;
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      border-radius: var(--md-shape-corner-small);
      font-size: 11.5px;
      line-height: 1.4;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.2s ease-in-out;
    }

    .alert-banner.visible {
      display: flex;
    }

    .alert-banner svg {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Stashed List Container */
    .list-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 8px 8px;
      max-height: 380px;
    }

    .list-wrapper::-webkit-scrollbar {
      width: 6px;
    }

    .list-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }

    .list-wrapper::-webkit-scrollbar-thumb {
      background-color: var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-full);
    }

    .stashed-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* List Item */
    .stashed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: var(--md-shape-corner-small);
      background-color: transparent;
      transition: background-color 0.15s ease;
      cursor: pointer;
    }

    .stashed-item:hover {
      background-color: var(--md-sys-color-surface-container);
    }

    .item-content {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .item-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 2px;
      object-fit: contain;
    }

    .item-favicon-fallback {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      fill: var(--md-sys-color-on-surface-variant);
    }

    .item-details {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-title {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-domain {
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Delete Button (Material Icon Button) */
    .btn-delete {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: var(--md-shape-corner-full);
      border: none;
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: 6px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-delete:hover {
      background-color: rgba(186, 26, 26, 0.1);
      color: var(--md-sys-color-error);
    }

    .btn-delete svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Empty State */
    .empty-state {
      padding: 32px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 12px;
    }

    .empty-state svg {
      width: 36px;
      height: 36px;
      fill: var(--md-sys-color-outline);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="app-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#0b57d0">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14-5-5 1.41-1.41L12 14.17l5.59-5.59L19 10l-7 7z"/>
      </svg>
      <span>Live Tab Stasher</span>
    </div>
    <span id="tabCount" class="app-badge" aria-label="Total stashed tabs">0</span>
  </header>

  <!-- Stash Primary Action -->
  <section class="action-container">
    <button id="stashBtn" class="btn-primary" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
      <span>Stash Current Tab</span>
    </button>
  </section>

  <!-- Error/Restricted Notice Banner -->
  <aside id="alertBanner" class="alert-banner" role="alert" aria-live="polite">
    <svg viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
    </svg>
    <span id="alertMessage">Restricted browser page cannot be stashed.</span>
  </aside>

  <!-- List Container -->
  <main class="list-wrapper">
    <ul id="stashedList" class="stashed-list">
      <!-- Items dynamically injected by popup.js -->
    </ul>
  </main>

  <script src="popup.js"></script>
</body>
</html>
